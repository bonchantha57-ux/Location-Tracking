<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- High-tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Ambient Radar Orbit Ring -->
  <circle cx="60" cy="60" r="55" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.65" />
  
  <!-- Main High-Tech Squircle Badge -->
  <rect x="14" y="14" width="92" height="92" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Glass Top Sheen -->
  <path d="M 16 42 C 16 26.5 26.5 16 42 16 L 78 16 C 93.5 16 104 26.5 104 42 C 78 46 42 46 16 42 Z" fill="#ffffff" fill-opacity="0.18" />

  <!-- Radar Telemetry Concentric Circles -->
  <circle cx="60" cy="60" r="32" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="60" cy="60" r="22" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="3 3" />
  
  <!-- Glowing GPS Stealth Compass Arrow -->
  <g filter="url(#glow)">
    <path d="M 60 26 L 86 86 L 60 72 L 34 86 Z" fill="url(#arrowGrad)" />
    <!-- 3D Shading -->
    <path d="M 60 26 L 60 72 L 86 86 Z" fill="#0284c7" fill-opacity="0.3" />
    <path d="M 60 26 L 34 86 L 60 72 Z" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- Radar Core Beacon Center Dot -->
  <circle cx="60" cy="58" r="4" fill="#38bdf8" />
  <circle cx="60" cy="58" r="2" fill="#ffffff" />

  <!-- Live Satellite Online Ping Beacon (Top Right) -->
  <circle cx="94" cy="26" r="6" fill="#10b981" filter="url(#glow)" />
  <circle cx="94" cy="26" r="3" fill="#ffffff" />
</svg>

